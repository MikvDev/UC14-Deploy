<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body  class="bg-cover h-screen w-screen"  style="background-image: url('./src/assets/rm218batch4-ning-24.jpg') " >
    <main class=" h-screen w-screen  flex justify-center items-center">

        
        <div class="flex flex-col  justify-between   rounded-3xl p-10 h-fit w-[400px] border border-white/20 text-white  bg-black/30 backdrop-blur-md shadow-lg gap-10 "  >
            <div class="text-center flex flex-col gap-3"> 
                <a href="/pages/register.html">Não tem uma conta ainda? Se cadastre</a>
                <h1 class="text-2xl font-medium">
                    Sign

                <p class="p-3">

            <div>

                    </div>
                    <a href="">Forgot your password?</a>
                    <div class="error-message hidden text-red-300 ">

                    </div>
                   <button class="bg-white text-black w-full h-[50px] gap-2 rounded-[20px] opacity-100 flex justify-center items-center"><i data-lucide="DoorOpen"></i>Entrar</button>
                    
                </form>

        </div>
